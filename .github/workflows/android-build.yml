name: Android Build

# Compila o app mobile a cada push/PR que tocar no código Android. Não
# troca nenhum threshold nem lógica sozinho -- só garante que o projeto
# ainda compila antes de mergear, para pegar quebras de build (ex.: dois
# devs mexendo nas mesmas constantes de calibração) antes que virem
# confusão em código já mergeado.
on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - "computer/tests/fixtures/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "computer/tests/fixtures/**"
      - ".github/workflows/android-build.yml"
  # Tambem pela aba Actions, pra republicar o APK do site sem mexer no app.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write so pra trocar o APK da release "app" (ultimo passo).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --console=plain

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      # O APK guardado e conveniencia pra baixar e instalar; o que este
      # workflow garante e o de cima (compila, testes, APK gerado).
      #
      # Cada APK tem ~140 MB. Guardando um por push, de toda branch, pelos 90
      # dias padrao, a cota de armazenamento de artefatos da conta encheu em
      # 12/09/2026 (24 APKs, 3,2 GB) e dali em diante TODO build ficou
      # vermelho neste passo -- com compilacao, testes e APK passando. Por
      # isso: so na main, 14 dias, e falha aqui nao derruba o build. Os antigos
      # saem pelo limpar-artefatos.yml.
      - name: Upload debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          # O APK ja e um zip; comprimir de novo so gasta tempo.
          compression-level: 0

      # O APK que o site entrega. O botao e o QR apontam sempre para
      # releases/download/app/VisuAll.apk; aqui so trocamos o arquivo da
      # release "app", entao o link nunca muda. Ela e marcada como pre-release
      # pra nao tomar o lugar da v1.0.0 como "Latest". O GitHub nao cobra
      # armazenamento de release, diferente dos artefatos de cima.
      - name: Publish APK for the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VisuAll.apk
          gh release view app > /dev/null 2>&1 || gh release create app             --title "VisuAll para Android (versao de testes)"             --notes "APK mais recente da main, trocado automaticamente a cada build. Baixe pelo site."             --prerelease --target main
          gh release upload app VisuAll.apk --clobber
